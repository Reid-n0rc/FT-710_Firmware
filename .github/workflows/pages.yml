name: pages
# Builds the GitHub Pages site: the landing page in site/ plus the CAT documents from docs/ (site/build.py), rendered by Jekyll.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - README.md
      - tools/readability_stats.py
      - docs/cat-undocumented.md
      - docs/cat-commands.md
      - docs/cat-commands-primary.md
      - docs/guide/img/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site source
        run: python3 -I site/build.py _build
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_build
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
