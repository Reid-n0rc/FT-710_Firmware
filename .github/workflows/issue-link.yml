name: issue-link
# Pull requests must start from an issue: the body has to link an existing issue with a closing keyword
# ("Closes #12", "Fixes #12", "Resolves #12"). Repository owners and admins may push directly; the branch ruleset lets them bypass.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  issues: read
  pull-requests: read
jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR links an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          n=$(printf '%s' "$body" | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | head -1 | grep -oE '[0-9]+$' || true)
          if [ -z "$n" ]; then
            echo "::error::Link the issue this PR starts from, e.g. 'Closes #12' in the PR description (see CONTRIBUTING.md)."
            exit 1
          fi
          if ! gh api "repos/$REPO/issues/$n" --jq '.number' >/dev/null 2>&1; then
            echo "::error::Issue #$n does not exist in $REPO."
            exit 1
          fi
          echo "Linked issue: #$n"
