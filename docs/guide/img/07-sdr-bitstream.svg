<polyline points="877,168 877,184" fill="none" stroke="#EA580C" stroke-width="1.5"/>
<rect x="525" y="184" width="44" height="30" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="547" y="204" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">DSP</text>
<polyline points="569,199 591,199" fill="none" stroke="#EA580C" stroke-width="1.5"/>
<rect x="591" y="184" width="44" height="30" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="613" y="204" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">RAM</text>
<polyline points="635,199 657,199" fill="none" stroke="#EA580C" stroke-width="1.5"/>
<rect x="657" y="184" width="44" height="30" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="679" y="204" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">LUT</text>
<polyline points="701,199 723,199" fill="none" stroke="#EA580C" stroke-width="1.5"/>
<rect x="723" y="184" width="44" height="30" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="745" y="204" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">FF</text>
<polyline points="767,199 789,199" fill="none" stroke="#EA580C" stroke-width="1.5"/>
<rect x="789" y="184" width="44" height="30" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="811" y="204" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">LUT</text>
<polyline points="833,199 855,199" fill="none" stroke="#EA580C" stroke-width="1.5"/>
<rect x="855" y="184" width="44" height="30" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="877" y="204" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">FF</text>
<text x="720" y="240" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">Bits set every logic table, flip-flop, multiplier,</text>
<text x="720" y="258" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">memory and wire switch. Loaded once at power-on.</text>
<text x="480" y="305" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">FT-710_SDR_V0104: about 2.2 MB, read from the module's QSPI flash at power-on</text>
<rect x="40" y="320" width="64" height="50" rx="0" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="72.0" y="351" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">header</text>
<rect x="104" y="320" width="36" height="50" rx="0" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<rect x="140" y="320" width="610" height="50" rx="0" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
<text x="445.0" y="351" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">block 0: frames 0-4389</text>
<rect x="750" y="320" width="150" height="50" rx="0" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="825.0" y="351" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">block 1: 4390-5419</text>
<rect x="900" y="320" width="30" height="50" rx="0" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="72" y="392" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">4 KB:</text>
<text x="72" y="409" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">CRC-32</text>
<polyline points="122,418 122,372" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#a_grey)"/>
<text x="130" y="433" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">settings: quad-SPI boot, chip ID 7A50T</text>
<text x="440" y="392" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">logic and routing: 4,390 frames of 101 words</text>
<text x="825" y="392" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">block-RAM</text>
<text x="825" y="409" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">contents (tables)</text>
<polyline points="915,418 915,372" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#a_grey)"/>
<text x="910" y="433" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937">CRC + start</text>
<text x="480" y="460" font-size="14" font-weight="normal" text-anchor="middle" fill="#6B7280" font-style="italic">Bar roughly to scale; the header and settings are widened so they can be seen.</text>
<text x="480" y="505" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">How full the XC7A50T is</text>
<text x="230" y="549" font-size="15" font-weight="normal" text-anchor="end" fill="#1F2937">logic tables (LUT)</text>
<rect x="245" y="529" width="500" height="28" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<rect x="245" y="529" width="410.0" height="28" rx="4" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
<text x="755" y="549" font-size="15" font-weight="normal" text-anchor="start" fill="#1F2937">82 %   (26,608 of 32,600)</text>
<text x="230" y="601" font-size="15" font-weight="normal" text-anchor="end" fill="#1F2937">flip-flops</text>
<rect x="245" y="581" width="500" height="28" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<rect x="245" y="581" width="240.0" height="28" rx="4" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
<text x="755" y="601" font-size="15" font-weight="normal" text-anchor="start" fill="#1F2937">48 %   (31,384 of 65,200)</text>
<text x="230" y="653" font-size="15" font-weight="normal" text-anchor="end" fill="#1F2937">multipliers (DSP48)</text>
<rect x="245" y="633" width="500" height="28" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<rect x="245" y="633" width="495.0" height="28" rx="4" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
<text x="755" y="653" font-size="15" font-weight="normal" text-anchor="start" fill="#1F2937">99 %   (119 of 120)</text>
<text x="230" y="705" font-size="15" font-weight="normal" text-anchor="end" fill="#1F2937">block RAM (36 Kb)</text>
<rect x="245" y="685" width="500" height="28" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<rect x="245" y="685" width="465.0" height="28" rx="4" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
<text x="755" y="705" font-size="15" font-weight="normal" text-anchor="start" fill="#1F2937">93 %   (70 of 75)</text>
<text x="480" y="750" font-size="15" font-weight="normal" text-anchor="middle" fill="#1F2937">Nearly full, and almost every hardware multiplier is in use: a signal-processing design.</text>
</svg>
