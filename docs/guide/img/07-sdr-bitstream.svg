<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2937">
<title>SDR image: a bitstream, not a program</title>
<defs><marker id="a_main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a_disp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="a_dsp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333EA"/></marker><marker id="a_sdr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker><marker id="a_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a_danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="a_caution" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="a_white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="0" y="0" width="960" height="770" fill="#FFFFFF"/>
<text x="480" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">The SDR image is a bitstream: a wiring plan, not a program</text>
<rect x="20" y="50" width="440" height="220" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="240" y="75" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">CPU firmware (MAIN, DISPLAY, IF DSP)</text>
<rect x="45" y="92" width="150" height="28" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="120" y="111" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">instruction 1</text>
<rect x="45" y="126" width="150" height="28" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="120" y="145" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">instruction 2</text>
<rect x="45" y="160" width="150" height="28" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="120" y="179" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">instruction 3</text>
<rect x="45" y="194" width="150" height="28" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="120" y="213" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">...</text>
<rect x="270" y="110" width="160" height="80" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="350.0" y="134.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">CPU</text>
<text x="350.0" y="157.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">fetch, execute,</text>
<text x="350.0" y="176.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">repeat</text>
<polyline points="195,150 270,150" fill="none" stroke="#1F2937" stroke-width="2" marker-end="url(#a_ink)"/>
<text x="240" y="255" font-size="14" font-weight="normal" text-anchor="middle" fill="#1F2937">A list of steps that a processor works through.</text>
