<title>FPGA hello stage 1: a JTAG-only test design</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0" y="0" width="960" height="700" fill="#FFFFFF"/>
<text x="480" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2937" >FPGA “hello”, stage 1: a test design that touches no pin</text>
<rect x="24" y="110" width="150" height="96" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<rect x="36" y="122" width="126" height="62" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" />
<text x="99" y="148" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Vivado or</text>
<text x="99" y="166" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >openFPGALoader</text>
<path d="M14,212 L184,212 L174,226 L24,226 z" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
<text x="99" y="248" font-size="14" text-anchor="middle" font-weight="normal" fill="#374151" >laptop</text>
<rect x="206" y="136" width="96" height="44" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="254" y="155" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >JTAG</text>
<text x="254" y="173" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >cable</text>
<line x1="176" y1="158" x2="204" y2="158" stroke="#1F2937" stroke-width="2" marker-end="url(#ah)"/>
<text x="330" y="148" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2937" >J2001</text>
<rect x="356" y="64" width="400" height="360" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2" />
