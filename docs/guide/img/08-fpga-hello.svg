<rect x="538.5" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="562.0" y="56" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="562.0" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="585.5" y="56" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="585.5" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="609.0" y="56" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="609.0" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="632.5" y="56" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="632.5" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="656.0" y="56" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="656.0" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
