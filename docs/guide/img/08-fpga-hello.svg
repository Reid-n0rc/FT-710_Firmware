<rect x="679.5" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="703.0" y="56" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="703.0" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="726.5" y="56" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="726.5" y="424" width="12" height="8" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="756" y="86.0" width="8" height="12" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="756" y="109.5" width="8" height="12" fill="#D1D5DB" stroke="#6B7280"/>
<rect x="756" y="133.0" width="8" height="12" fill="#D1D5DB" stroke="#6B7280"/>
