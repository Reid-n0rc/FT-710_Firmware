<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>The shadow-register idea used on every control link</title>
  <style>
    text { fill: #1F2937; font-size: 14px; }
    .h { font-size: 20px; font-weight: bold; }
    .b { font-weight: bold; }
    .s { fill: #4B5563; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 14px; }
    .grey { fill: #F3F4F6; stroke: #6B7280; stroke-width: 2; }
    .main { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; }
    .sdr { fill: #FFEDD5; stroke: #EA580C; stroke-width: 2; }
    .ok { fill: #DCFCE7; stroke: #16A34A; stroke-width: 2; }
    .warn { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; }
    .arr { stroke: #1F2937; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2937"/></marker>
  </defs>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="34" text-anchor="middle" class="h">Shadow registers: send only what changed</text>

  <!-- knob icon -->
  <circle cx="70" cy="110" r="34" fill="#F3F4F6" stroke="#1F2937" stroke-width="3"/>
  <circle cx="70" cy="110" r="22" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <line x1="70" y1="110" x2="70" y2="82" stroke="#1F2937" stroke-width="4"/>
  <text x="70" y="166" text-anchor="middle">you pick a</text>
  <text x="70" y="184" text-anchor="middle">200 kHz span</text>
  <path d="M110 110 H146" class="arr"/>

  <!-- MAIN state -->
  <rect x="150" y="66" width="200" height="88" rx="8" class="main"/>
  <text x="250" y="92" text-anchor="middle" class="b">MAIN radio state</text>
  <text x="250" y="114" text-anchor="middle">mode USB, width 3 kHz,</text>
  <text x="250" y="134" text-anchor="middle">span now 200 kHz</text>
  <path d="M350 110 H386" class="arr"/>


  <!-- table -->
  <rect x="390" y="56" width="550" height="200" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="404" y="82" class="b">FPGA register</text>
  <text x="590" y="82" class="b">wanted</text>
  <text x="700" y="82" class="b">shadow</text>
  <text x="810" y="82" class="b">action</text>
  <line x1="390" y1="94" x2="940" y2="94" stroke="#6B7280" stroke-width="2"/>
  <text x="404" y="120">0x0A mode class</text>
  <text x="590" y="120" class="m">0004</text>
  <text x="700" y="120" class="m">0004</text>
  <text x="810" y="120" class="s">same: skip</text>
  <text x="404" y="152">0x1F filter width</text>
  <text x="590" y="152" class="m">0BB8</text>
  <text x="700" y="152" class="m">0BB8</text>
  <text x="810" y="152" class="s">same: skip</text>
  <rect x="396" y="164" width="538" height="34" rx="6" class="warn"/>
  <text x="404" y="186" class="b">0x22 scope span</text>
  <text x="590" y="186" class="m b">00C8</text>
  <text x="700" y="186" class="m">0064</text>
  <text x="810" y="186" class="b">differs: send</text>
  <text x="404" y="224" class="s">… about 35 registers for the FPGA and about 75 for the DSP</text>
  <text x="404" y="244" class="s">shadow = the last value the other chip acknowledged</text>

  <!-- cycle -->
  <rect x="40" y="300" width="250" height="78" rx="8" class="main"/>
  <text x="165" y="326" text-anchor="middle" class="b">one write per pass</text>
  <text x="165" y="348" text-anchor="middle" class="m">w002200C8 + sum + CR</text>
  <text x="165" y="368" text-anchor="middle" class="s">first changed register only</text>
  <path d="M290 339 H356" class="arr"/>

  <rect x="360" y="300" width="230" height="78" rx="8" class="sdr"/>
  <text x="475" y="326" text-anchor="middle" class="b">FPGA</text>
  <text x="475" y="348" text-anchor="middle">stores the value,</text>
  <text x="475" y="368" text-anchor="middle">answers 06</text>
  <path d="M590 312 H656" class="arr"/><path d="M590 400 H656" class="arr"/><line x1="590" y1="312" x2="590" y2="400" stroke="#1F2937" stroke-width="2"/>
  <text x="623" y="304" text-anchor="middle" class="s">yes</text>
  <text x="623" y="392" text-anchor="middle" class="s">no</text><text x="475" y="292" text-anchor="middle" class="s">answer within 6 ms?</text>

  <rect x="660" y="280" width="280" height="64" rx="8" class="ok"/>
  <text x="800" y="306" text-anchor="middle" class="b">yes: ACK</text>
  <text x="800" y="328" text-anchor="middle">shadow := 00C8, done</text>
  <rect x="660" y="360" width="280" height="80" rx="8" class="warn"/>
  <text x="800" y="386" text-anchor="middle" class="b">no answer, or "?"</text>
  <text x="800" y="408" text-anchor="middle">shadow stays 0064, so the</text>
  <text x="800" y="428" text-anchor="middle">same write goes out again</text>
  <path d="M800 440 V480 H165 V382" class="arr"/>
  <text x="480" y="472" text-anchor="middle" class="s">next pass of MAIN's main loop: compare again</text>

  <text x="40" y="526">No retry counter and no error message: a lost frame simply shows up as "still different" next time.</text>
  <text x="40" y="550">Big changes trickle out one register per pass. A frequency is 32 bits, so it goes out as two writes,</text>
  <text x="40" y="574">high half first; for a pass or two the FPGA can hold a mixed value (inference).</text>
</svg>
