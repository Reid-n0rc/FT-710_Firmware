<svg xmlns="http://www.w3.org/2000/svg" width="960" height="622" viewBox="0 0 960 622" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
  <title>The read-only CAT tests, run on a radio on 2026-10-28; every answer matched the firmware analysis</title>
  <rect width="960" height="622" fill="#FFFFFF"/>
  <text x="480" y="34" font-size="20" font-weight="bold" text-anchor="middle">Read-only tests, run on a radio (2026-10-28)</text>
  <text x="480" y="58" font-size="15" text-anchor="middle" fill="#6B7280">Every answer had the format the firmware analysis predicted. Nothing was written.</text>
  <text x="40" y="94" font-size="15" font-weight="bold">send (read only)</text>
  <text x="290" y="94" font-size="15" font-weight="bold">radio answered</text>
  <text x="470" y="94" font-size="15" font-weight="bold">what it shows</text>
  <text x="836" y="94" font-size="15" font-weight="bold" text-anchor="middle">status</text>
  <rect x="32" y="108" width="896" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="137" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">VE0;</text>
  <text x="290" y="137" font-size="14" font-family="DejaVu Sans Mono, monospace">VE00112;</text>
  <text x="470" y="137" font-size="14">MAIN version V01-12</text>
  <rect x="752" y="116" width="168" height="30" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="836" y="136" font-size="14" text-anchor="middle">confirmed</text>
  <rect x="32" y="162" width="896" height="46" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="191" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">VE1; VE2; VE3;</text>
  <text x="290" y="191" font-size="14" font-family="DejaVu Sans Mono, monospace">0108  0104  0101</text>
  <text x="470" y="191" font-size="14">DISPLAY, SDR, DSP: V01-08/04/01</text>
  <rect x="752" y="170" width="168" height="30" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="836" y="190" font-size="14" text-anchor="middle">confirmed</text>
  <rect x="32" y="216" width="896" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="245" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">JP0710;</text>
  <text x="290" y="245" font-size="14" font-family="DejaVu Sans Mono, monospace">50E2 AF1D 2306260856</text>
  <text x="470" y="245" font-size="14">region 0x50E2 (wide), 2023-06-26</text>
  <rect x="752" y="224" width="168" height="30" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="836" y="244" font-size="14" text-anchor="middle">confirmed</text>
  <rect x="32" y="270" width="896" height="46" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="299" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">FD000; FD001; FD002;</text>
  <text x="290" y="299" font-size="14" font-family="DejaVu Sans Mono, monospace">14.037 13.937 14.000</text>
  <text x="470" y="299" font-size="14">scope start: dial, CURSOR, FIX (MHz)</text>
  <rect x="752" y="278" width="168" height="30" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="836" y="298" font-size="14" text-anchor="middle">confirmed</text>
  <rect x="32" y="324" width="896" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="353" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">PE000;</text>
  <text x="290" y="353" font-size="14" font-family="DejaVu Sans Mono, monospace">PE000003;</text>
  <text x="470" y="353" font-size="14">first of the 18 EQ-like values</text>
  <rect x="752" y="332" width="168" height="30" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="836" y="352" font-size="14" text-anchor="middle">confirmed</text>
  <rect x="32" y="378" width="896" height="46" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="44" y="407" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">SPIR;</text>
  <text x="290" y="407" font-size="14" font-family="DejaVu Sans Mono, monospace">SPIR + 36 hex</text>
  <text x="470" y="407" font-size="14">the 12 raw ADC readings</text>
  <rect x="752" y="386" width="168" height="30" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="836" y="406" font-size="14" text-anchor="middle">confirmed</text>
  <rect x="32" y="446" width="896" height="72" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="48" y="474" font-size="15"><tspan font-weight="bold">Also read-only, but noisy:</tspan> E8 returned the memory-channel image as one</text>
  <text x="48" y="498" font-size="15">10674-byte frame; signature and checksum correct.</text>
  <rect x="32" y="532" width="896" height="72" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="48" y="560" font-size="15" font-weight="bold">Never send (writes):</text>
  <text x="48" y="586" font-size="15" font-family="DejaVu Sans Mono, monospace">SPSW  SPDW  SPW  SPAWE  E9  ZZ  JP-set</text>
</svg>
