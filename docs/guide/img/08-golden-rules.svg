<svg xmlns="http://www.w3.org/2000/svg" width="960" height="564" viewBox="0 0 960 564" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
<title>Golden rules for working on the radio</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0" y="0" width="960" height="564" fill="#FFFFFF"/>
<text x="480" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2937" >Three golden rules</text>
<rect x="16" y="56" width="296" height="214" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
<circle cx="50" cy="90" r="20" fill="#DC2626"/>
<text x="50" y="97" font-size="20" text-anchor="middle" font-weight="bold" fill="#FFFFFF" >1</text>
<text x="80" y="97" font-size="18" text-anchor="start" font-weight="bold" fill="#DC2626" >Ask first</text>
<text x="34" y="140" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >Nothing is written to the radio</text>
<text x="34" y="161" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >without the owner's explicit</text>
<text x="34" y="182" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >approval, each time: flashing,</text>
<text x="34" y="203" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >EEPROM writes, JTAG loads,</text>
<text x="34" y="224" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >untested CAT set commands.</text>
<rect x="328" y="56" width="296" height="214" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
<circle cx="362" cy="90" r="20" fill="#DC2626"/>
<text x="362" y="97" font-size="20" text-anchor="middle" font-weight="bold" fill="#FFFFFF" >2</text>
<text x="392" y="97" font-size="18" text-anchor="start" font-weight="bold" fill="#DC2626" >Keep option bytes</text>
<text x="346" y="140" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >A patched MAIN image carries</text>
<text x="346" y="161" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >MAIN's 116-byte option-setting</text>
<text x="346" y="182" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >memory. Keep every byte 0xFF.</text>
<text x="346" y="203" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >The traps are below.</text>
<rect x="640" y="56" width="296" height="214" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" />
<circle cx="674" cy="90" r="20" fill="#16A34A"/>
<text x="674" y="97" font-size="20" text-anchor="middle" font-weight="bold" fill="#FFFFFF" >3</text>
<text x="704" y="97" font-size="18" text-anchor="start" font-weight="bold" fill="#16A34A" >DISPLAY first</text>
<text x="658" y="140" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >DISPLAY reads the SD card and</text>
<text x="658" y="161" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >updates every other chip. While</text>
<text x="658" y="182" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >DISPLAY boots, the stock files</text>
<text x="658" y="203" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >restore everything. So start</text>
<text x="658" y="224" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >with DISPLAY patches, and keep</text>
<text x="658" y="245" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >DISPLAY healthy.</text>
<rect x="16" y="288" width="928" height="210" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" />
<text x="32" y="316" font-size="17" text-anchor="start" font-weight="bold" fill="#B91C1C" >Why the option bytes matter: three one-way doors in the RX651</text>
<rect x="32" y="334" width="288" height="104" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
<text x="176" y="362" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2937" >Access window lock</text>
<text x="176" y="388" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Once its protect bit is 0,</text>
<text x="176" y="408" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >it can never be set back to 1.</text>
<rect x="336" y="334" width="288" height="104" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
<text x="480" y="362" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2937" >Serial programmer off</text>
<text x="480" y="388" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Locks out the serial boot mode,</text>
<text x="480" y="408" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >and DISPLAY's MAIN update uses it.</text>
<rect x="640" y="334" width="288" height="104" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
<text x="784" y="362" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2937" >Control code 0x45</text>
<text x="784" y="388" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Wrong ID three times</text>
<text x="784" y="408" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >and the chip erases its flash.</text>
<text x="480" y="470" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Today all 116 bytes are 0xFF: nothing protected, serial programming allowed, ID = 16 × 0xFF.</text>
<text x="480" y="488" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >The encoder always writes this area, so a patched MAIN image must copy it unchanged.</text>
<text x="480" y="524" font-size="14" text-anchor="middle" font-weight="normal" fill="#374151" >Also: transmit changes must stay within the licence (FCC Part 97 in the US),</text>
<text x="480" y="544" font-size="14" text-anchor="middle" font-weight="normal" fill="#374151" >and patched or decoded images stay local and are never published.</text>
</svg>
