<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
  <title>How the DISPLAY CPU reaches every chip during an update</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold">One CPU updates them all: the DISPLAY reads the SD card and drives every path</text>

  <!-- SD card icon -->
  <path d="M30,160 L80,160 L100,180 L100,260 L30,260 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="40" y="168" width="6" height="16" fill="#6B7280"/><rect x="52" y="168" width="6" height="16" fill="#6B7280"/><rect x="64" y="168" width="6" height="16" fill="#6B7280"/>
  <text x="65" y="225" text-anchor="middle" font-size="15" font-weight="bold">SD</text>
  <text x="65" y="290" text-anchor="middle" font-size="14">I:\FT-710\</text>
  <text x="65" y="308" text-anchor="middle" font-size="14">*.sfl</text>
  <line x1="102" y1="210" x2="166" y2="210" stroke="#16A34A" stroke-width="3" marker-end="url(#ahg)"/>

  <!-- DISPLAY chip -->
  <g stroke="#16A34A" stroke-width="2">
    <line x1="190" y1="130" x2="190" y2="140"/><line x1="220" y1="130" x2="220" y2="140"/><line x1="250" y1="130" x2="250" y2="140"/><line x1="280" y1="130" x2="280" y2="140"/><line x1="310" y1="130" x2="310" y2="140"/><line x1="340" y1="130" x2="340" y2="140"/>
  </g>
  <rect x="170" y="140" width="200" height="140" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
  <text x="270" y="174" text-anchor="middle" font-size="18" font-weight="bold">DISPLAY</text>
  <text x="270" y="196" text-anchor="middle" font-size="14">Renesas RZ/A1H</text>
  <text x="270" y="222" text-anchor="middle" font-size="14">checks CRC, decodes,</text>
  <text x="270" y="242" text-anchor="middle" font-size="14">drives the update</text>

  <!-- DISPLAY flash -->
  <line x1="270" y1="282" x2="270" y2="356" stroke="#16A34A" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="280" y="324" font-size="14" fill="#16A34A" font-weight="bold">② own flash</text>
  <rect x="150" y="360" width="240" height="96" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="270" y="382" text-anchor="middle" font-size="15" font-weight="bold">16 MB SPI flash</text>
  <rect x="164" y="394" width="100" height="48" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="214" y="423" text-anchor="middle" font-size="14">bank 1</text>
  <rect x="276" y="394" width="100" height="48" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="326" y="423" text-anchor="middle" font-size="14">bank 2</text>

  <!-- MAIN chip -->
  <rect x="500" y="140" width="190" height="140" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <g stroke="#2563EB" stroke-width="2">
    <line x1="520" y1="280" x2="520" y2="290"/><line x1="550" y1="280" x2="550" y2="290"/><line x1="580" y1="280" x2="580" y2="290"/><line x1="610" y1="280" x2="610" y2="290"/><line x1="640" y1="280" x2="640" y2="290"/><line x1="670" y1="280" x2="670" y2="290"/>
  </g>
  <text x="595" y="174" text-anchor="middle" font-size="18" font-weight="bold">MAIN</text>
  <text x="595" y="196" text-anchor="middle" font-size="14">Renesas RX651</text>
  <text x="595" y="222" text-anchor="middle" font-size="14">① its boot ROM is</text>
  <text x="595" y="242" text-anchor="middle" font-size="14">programmed directly;</text>
  <text x="595" y="262" text-anchor="middle" font-size="14">③ ④ it relays</text>

  <!-- DISPLAY-MAIN link -->
  <line x1="372" y1="190" x2="496" y2="190" stroke="#1F2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="434" y="180" text-anchor="middle" font-size="14">UART link</text>
  <line x1="372" y1="232" x2="496" y2="232" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/>
  <text x="434" y="222" text-anchor="middle" font-size="14" fill="#2563EB">① RESET, UPDATE</text>

  <!-- IFDSP -->
  <rect x="780" y="70" width="160" height="100" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/>
  <text x="860" y="100" text-anchor="middle" font-size="18" font-weight="bold">IFDSP</text>
  <text x="860" y="122" text-anchor="middle" font-size="14">NXP RT685</text>
  <text x="860" y="144" text-anchor="middle" font-size="14">ROM ISP</text>
  <rect x="790" y="180" width="140" height="40" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="860" y="205" text-anchor="middle" font-size="14">QSPI flash</text>
  <line x1="860" y1="170" x2="860" y2="178" stroke="#9333EA" stroke-width="2"/>
  <path d="M692,170 L740,170 L740,120 L776,120" fill="none" stroke="#9333EA" stroke-width="3" marker-end="url(#ah)"/>
  <text x="732" y="104" text-anchor="end" font-size="14" fill="#9333EA" font-weight="bold">③ UART +</text>
  <text x="732" y="122" text-anchor="end" font-size="14" fill="#9333EA">DSP_UPDATE</text>

  <!-- SDR -->
  <rect x="780" y="300" width="160" height="110" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="3"/>
  <text x="860" y="330" text-anchor="middle" font-size="18" font-weight="bold">SDR FPGA</text>
  <text x="860" y="352" text-anchor="middle" font-size="14">Xilinx Artix-7</text>
  <text x="860" y="374" text-anchor="middle" font-size="14">writes its own</text>
  <text x="860" y="394" text-anchor="middle" font-size="14">flash</text>
  <rect x="790" y="440" width="140" height="40" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="860" y="465" text-anchor="middle" font-size="14">config flash</text>
  <line x1="860" y1="412" x2="860" y2="436" stroke="#EA580C" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M692,250 L740,250 L740,330 L776,330" fill="none" stroke="#EA580C" stroke-width="3" marker-end="url(#ah)"/>
  <text x="732" y="312" text-anchor="end" font-size="14" fill="#EA580C" font-weight="bold">④ commands</text>
  <text x="732" y="330" text-anchor="end" font-size="14" fill="#EA580C">+ SDR_UPDATE</text>
  <!-- RSPI2 direct data -->
  <path d="M370,268 L430,268 L430,370 L776,370" fill="none" stroke="#EA580C" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#ah)"/>
  <text x="440" y="394" font-size="14" fill="#EA580C" font-weight="bold">④ bitstream data, 4 KiB blocks over SPI</text>
  <text x="440" y="414" font-size="14" fill="#EA580C">(the pins that normally carry the scope stream)</text>

  <!-- legend -->
  <rect x="20" y="490" width="920" height="96" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/>
  <text x="36" y="514" font-size="14"><tspan font-weight="bold">①</tspan> MAIN: Renesas serial boot mode over the normal DISPLAY–MAIN UART (reset + mode pins).</text>
  <text x="36" y="536" font-size="14"><tspan font-weight="bold">②</tspan> DISPLAY: writes the spare bank of its own SPI flash, then flips the bank flags.</text>
  <text x="36" y="558" font-size="14"><tspan font-weight="bold">③</tspan> IFDSP: MAIN puts the RT685 in its ROM boot loader and forwards NXP ISP packets.</text>
  <text x="36" y="580" font-size="14"><tspan font-weight="bold">④</tspan> SDR: MAIN relays register commands; the data goes straight from DISPLAY to the FPGA.</text>
</svg>
