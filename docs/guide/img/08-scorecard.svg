<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
<title>Custom firmware scorecard per chip</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0" y="0" width="960" height="580" fill="#FFFFFF"/>
<text x="480" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2937" >Can you run your own code? A scorecard per chip</text>
<rect x="208" y="56" width="180" height="64" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" />
<text x="298.0" y="82" font-size="18" text-anchor="middle" font-weight="bold" fill="#2563EB" >MAIN</text>
<text x="298.0" y="104" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Renesas RX651</text>
<rect x="396" y="56" width="180" height="64" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" />
<text x="486.0" y="82" font-size="18" text-anchor="middle" font-weight="bold" fill="#16A34A" >DISPLAY</text>
<text x="486.0" y="104" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Renesas RZ/A1H</text>
<rect x="584" y="56" width="180" height="64" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="2" />
<text x="674.0" y="82" font-size="18" text-anchor="middle" font-weight="bold" fill="#9333EA" >IFDSP</text>
<text x="674.0" y="104" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >NXP i.MX RT685</text>
<rect x="772" y="56" width="180" height="64" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2" />
<text x="862.0" y="82" font-size="18" text-anchor="middle" font-weight="bold" fill="#EA580C" >SDR</text>
<text x="862.0" y="104" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Xilinx XC7A50T FPGA</text>
<rect x="16" y="132" width="184" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="28" y="166.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >Code signed?</text>
<rect x="208" y="132" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="298.0" y="157.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No: obfuscation</text>
<text x="298.0" y="175.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >+ CRC only</text>
<rect x="396" y="132" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="486.0" y="166.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No</text>
<rect x="584" y="132" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="674.0" y="166.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No: plain image</text>
<rect x="772" y="132" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="862.0" y="166.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No</text>
<rect x="16" y="198" width="184" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="28" y="232.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >Encrypted?</text>
<rect x="208" y="198" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="298.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No</text>
<rect x="396" y="198" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="486.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No</text>
<rect x="584" y="198" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="674.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No</text>
<rect x="772" y="198" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="862.0" y="223.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No bitstream</text>
<text x="862.0" y="241.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >encryption</text>
<rect x="16" y="264" width="184" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="28" y="289.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >Lock bits /</text>
<text x="28" y="308.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >fuses</text>
<rect x="208" y="264" width="180" height="58" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
<text x="298.0" y="289.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Option memory all</text>
<text x="298.0" y="307.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >0xFF: nothing set</text>
<rect x="396" y="264" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="486.0" y="289.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >No secure boot;</text>
<text x="486.0" y="307.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >dual-bank loader</text>
<rect x="584" y="264" width="180" height="58" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
<text x="674.0" y="289.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >OTP fuses unknown</text>
<text x="674.0" y="307.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >(likely off)</text>
<rect x="772" y="264" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="862.0" y="298.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >None configured</text>
<rect x="16" y="330" width="184" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="28" y="355.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >Debug or boot</text>
<text x="28" y="374.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >header</text>
<rect x="208" y="330" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="298.0" y="355.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >J1004: FINE debug</text>
<text x="298.0" y="373.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >+ serial boot</text>
<rect x="396" y="330" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="486.0" y="364.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >J6003: ARM JTAG</text>
<rect x="584" y="330" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="674.0" y="355.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >J2009: SWD + UART;</text>
<text x="674.0" y="373.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >ROM serial ISP</text>
<rect x="772" y="330" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="862.0" y="364.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >J2001: FPGA JTAG</text>
<rect x="16" y="396" width="184" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="28" y="421.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >Free</text>
<text x="28" y="440.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2937" >toolchain</text>
<rect x="208" y="396" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="298.0" y="430.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >GCC for RX, LLVM</text>
<rect x="396" y="396" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="486.0" y="430.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >arm-none-eabi-gcc</text>
<rect x="584" y="396" width="180" height="58" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" />
<text x="674.0" y="421.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >M33 core: ARM GCC</text>
<text x="674.0" y="439.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >HiFi4 DSP: none</text>
<rect x="772" y="396" width="180" height="58" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="862.0" y="421.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Vivado (free),</text>
<text x="862.0" y="439.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >openXC7 / F4PGA</text>
<rect x="16" y="468" width="928" height="60" rx="8" fill="#F3F4F6" stroke="#1F2937" stroke-width="2" />
<text x="480" y="494" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F2937" >Verdict: no fundamental blocker found</text>
<text x="480" y="516" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >Every chip has a debug header and no signature check; the HiFi4 DSP is the one hard part.</text>
<rect x="16" y="542" width="22" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" />
<text x="46" y="558" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >open: nothing in the way</text>
<rect x="280" y="542" width="22" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
<text x="310" y="558" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >caution: keep as is, or not yet known</text>
<rect x="620" y="542" width="22" height="22" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" />
<text x="650" y="558" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937" >hard part: no free tool</text>
</svg>
