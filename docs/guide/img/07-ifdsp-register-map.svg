<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2937">
<title>IF DSP register file at a glance</title>
<defs><marker id="a_main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a_disp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="a_dsp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333EA"/></marker><marker id="a_sdr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker><marker id="a_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a_danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="a_caution" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="a_white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs>
<rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<text x="480" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">The IF DSP register file: 32,768 words of 16 bits (not to scale)</text>
<text x="190" y="58" font-size="14" font-weight="normal" text-anchor="middle" fill="#6B7280">register number</text>
<rect x="130" y="70" width="120" height="75" rx="0" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="120" y="86" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x0000</text>
<polyline points="250,107.5 290,107.5" fill="none" stroke="#9333EA" stroke-width="2"/>
<rect x="290" y="73" width="650" height="69" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
<text x="300" y="92.0" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">Status for MAIN (DSP writes, MAIN reads 0-4)</text>
<text x="300" y="114.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">0 = version 0x0101 (V01-01)  ·  1 = flags, bit 0 = DSP is up</text>
<text x="300" y="132.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">2, 3 = signal levels (S-meter, inference)  ·  4 = CW zero-in offset (inference)</text>
<rect x="130" y="145" width="120" height="65" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="120" y="161" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x0006</text>
<polyline points="250,177.5 290,177.5" fill="none" stroke="#2563EB" stroke-width="2"/>
<rect x="290" y="148" width="650" height="59" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="300" y="162.0" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">Mode and routing (MAIN writes)</text>
<text x="300" y="184.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">6 = demodulator: CW-U 0, CW-L 1, USB 2, LSB 3, AM 8, FM 9</text>
<text x="300" y="202.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">10 = also switches the codec input on the M33</text>
<rect x="130" y="210" width="120" height="75" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="120" y="226" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x0011</text>
<polyline points="250,247.5 290,247.5" fill="none" stroke="#2563EB" stroke-width="2"/>
<rect x="290" y="213" width="650" height="69" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="300" y="232.0" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">Transmit settings (MAIN writes)</text>
<text x="300" y="254.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">0x20 = TX gain in dB  ·  0x25-0x2D = 3-band TX EQ (inference)</text>
<text x="300" y="272.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">0x2E = speech processor (inference)  ·  0x35-0x38 = tone encoder (inference)</text>
<rect x="130" y="285" width="120" height="75" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="120" y="301" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x0040</text>
<polyline points="250,322.5 290,322.5" fill="none" stroke="#2563EB" stroke-width="2"/>
<rect x="290" y="288" width="650" height="69" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="300" y="307.0" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">Receive settings (MAIN writes)</text>
<text x="300" y="329.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">0x45 = notch / peak filter (inference)  ·  0x48-0x50 = RX EQ</text>
<text x="300" y="347.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">0x53 = CTCSS decoder  ·  0x5C, 0x5D = scope settings (both inference)</text>
<rect x="130" y="360" width="120" height="30" rx="0" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/>
<text x="190" y="380" font-size="14" font-weight="normal" text-anchor="middle" fill="#6B7280">unused</text>
<rect x="130" y="390" width="120" height="55" rx="0" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="120" y="406" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x2000</text>
<polyline points="250,417.5 290,417.5" fill="none" stroke="#9333EA" stroke-width="2"/>
<rect x="290" y="393" width="650" height="49" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
<text x="300" y="411.0" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">DSP load meter (DSP writes every second)</text>
<text x="300" y="433.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">0x2000-0x2007 = CPU use of each DSP thread, in percent</text>
<rect x="130" y="445" width="120" height="30" rx="0" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/>
<text x="190" y="465" font-size="14" font-weight="normal" text-anchor="middle" fill="#6B7280">unused</text>
<rect x="130" y="475" width="120" height="75" rx="0" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="120" y="491" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x4000</text>
<polyline points="250,512.5 290,512.5" fill="none" stroke="#9333EA" stroke-width="2"/>
<rect x="290" y="478" width="650" height="69" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
<text x="300" y="497.0" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">Mostly DSP-internal (defaults; MAIN writes 7 of them)</text>
<text x="300" y="519.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">0x4004 = input pin status  ·  0x4005 = level for the analogue</text>
<text x="300" y="537.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">PWM test output  ·  0x4011-0x401F = tuning constants</text>
<rect x="130" y="550" width="120" height="30" rx="0" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/>
<text x="190" y="570" font-size="14" font-weight="normal" text-anchor="middle" fill="#6B7280">unused</text>
<rect x="130" y="580" width="120" height="55" rx="0" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="120" y="596" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x7000</text>
<polyline points="250,607.5 290,607.5" fill="none" stroke="#9333EA" stroke-width="2"/>
<rect x="290" y="583" width="650" height="49" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
<text x="300" y="601.0" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">Two 4 KB capture blocks (0x7000, 0x7800)</text>
<text x="300" y="623.0" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">built into the DSP, but nothing fills them in this firmware</text>
<text x="120" y="650" font-size="14" font-weight="normal" text-anchor="end" fill="#1F2937" font-family="DejaVu Sans Mono, monospace">0x7FFF</text>
<polyline points="130,635 250,635" fill="none" stroke="#6B7280" stroke-width="2"/>
<rect x="20" y="670" width="920" height="80" rx="8" fill="#F8FAFF" stroke="#2563EB" stroke-width="2"/>
<text x="30" y="693.5" font-size="15" font-weight="bold" text-anchor="start" fill="#1F2937">Example: you switch the radio to USB</text>
<text x="30" y="716.5" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">MAIN sends  w00060002FF + CR  →  the M33 stores 2 in register 6 and answers ACK (0x06)</text>
<text x="30" y="735.5" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">→  the receive and transmit threads read register 6 and use the upper-sideband settings</text>
<rect x="150" y="765" width="22" height="16" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="180" y="778" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">set by MAIN</text>
<rect x="286.4" y="765" width="22" height="16" rx="4" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="316.4" y="778" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">set by the IF DSP</text>
<rect x="473.2" y="765" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="503.2" y="778" font-size="14" font-weight="normal" text-anchor="start" fill="#1F2937">unused</text>
</svg>
