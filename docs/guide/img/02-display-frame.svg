<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Anatomy of a DISPLAY to MAIN frame</title>
  <style>
    text { fill: #1F2937; font-size: 14px; }
    .h { font-size: 20px; font-weight: bold; }
    .b { font-weight: bold; }
    .s { fill: #4B5563; }
    .hex { font-family: DejaVu Sans Mono, monospace; font-size: 22px; font-weight: bold; }
    .m { font-family: DejaVu Sans Mono, monospace; font-size: 14px; }
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="34" text-anchor="middle" class="h">DISPLAY ↔ MAIN: one frame, byte by byte</text>

<text x="40" y="72" class="b">General shape (no start byte, no length byte on the wire)</text>
<rect x="40" y="84" width="120" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="100" y="114" text-anchor="middle" class="b">command</text>
<rect x="160" y="84" width="560" height="48" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="440" y="114" text-anchor="middle">payload: n bytes, n fixed per command (a 43-entry table)</text>
<rect x="720" y="84" width="120" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="780" y="114" text-anchor="middle" class="b">sum8</text>
<text x="40" y="156" class="s">sum8 = low byte of (command + every payload byte). ACK 0x06 and NAK 0x15 are single bytes with no sum.</text>
<text x="40" y="200" class="b">Example: the DISPLAY says hello at power-on</text>
<rect x="40" y="212" width="88" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="84.0" y="248" text-anchor="middle" class="hex">F0</text>
<text x="84.0" y="286" text-anchor="middle" class="s">byte 0</text>
<rect x="138" y="212" width="88" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="182.0" y="248" text-anchor="middle" class="hex">01</text>
<text x="182.0" y="286" text-anchor="middle" class="s">byte 1</text>
<rect x="236" y="212" width="88" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="280.0" y="248" text-anchor="middle" class="hex">08</text>
<text x="280.0" y="286" text-anchor="middle" class="s">byte 2</text>
<rect x="334" y="212" width="88" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="378.0" y="248" text-anchor="middle" class="hex">20</text>
<text x="378.0" y="286" text-anchor="middle" class="s">byte 3</text>
<rect x="432" y="212" width="88" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="476.0" y="248" text-anchor="middle" class="hex">23</text>
<text x="476.0" y="286" text-anchor="middle" class="s">byte 4</text>
<rect x="530" y="212" width="88" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="574.0" y="248" text-anchor="middle" class="hex">06</text>
<text x="574.0" y="286" text-anchor="middle" class="s">byte 5</text>
<rect x="628" y="212" width="88" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="672.0" y="248" text-anchor="middle" class="hex">29</text>
<text x="672.0" y="286" text-anchor="middle" class="s">byte 6</text>
<rect x="726" y="212" width="88" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="770.0" y="248" text-anchor="middle" class="hex">00</text>
<text x="770.0" y="286" text-anchor="middle" class="s">byte 7</text>
<rect x="824" y="212" width="88" height="56" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="868.0" y="248" text-anchor="middle" class="hex">6B</text>
<text x="868.0" y="286" text-anchor="middle" class="s">byte 8</text>
<path d="M44 296 v8 H124 v-8" stroke="#1F2937" stroke-width="2" fill="none"/>
<line x1="84.0" y1="304" x2="84.0" y2="312" stroke="#1F2937" stroke-width="2"/>
<text x="84.0" y="330" text-anchor="middle">hello</text>
<path d="M142 296 v8 H320 v-8" stroke="#1F2937" stroke-width="2" fill="none"/>
<line x1="231.0" y1="304" x2="231.0" y2="312" stroke="#1F2937" stroke-width="2"/>
<text x="231.0" y="330" text-anchor="middle">version</text>
<text x="231.0" y="350" text-anchor="middle">V01-08</text>
<path d="M338 296 v8 H712 v-8" stroke="#1F2937" stroke-width="2" fill="none"/>
<line x1="525.0" y1="304" x2="525.0" y2="312" stroke="#1F2937" stroke-width="2"/>
<text x="525.0" y="330" text-anchor="middle">date 2023-06-29</text>
<text x="525.0" y="350" text-anchor="middle">(MAIN keeps 23 06 29)</text>
<path d="M730 296 v8 H810 v-8" stroke="#1F2937" stroke-width="2" fill="none"/>
<line x1="770.0" y1="304" x2="770.0" y2="312" stroke="#1F2937" stroke-width="2"/>
<text x="770.0" y="330" text-anchor="middle">boot</text>
<text x="770.0" y="350" text-anchor="middle">code</text>
<path d="M828 296 v8 H908 v-8" stroke="#1F2937" stroke-width="2" fill="none"/>
<line x1="868.0" y1="304" x2="868.0" y2="312" stroke="#1F2937" stroke-width="2"/>
<text x="868.0" y="330" text-anchor="middle">check</text>
<text x="868.0" y="350" text-anchor="middle">sum</text>
<text x="40" y="402" class="m">F0+01+08+20+23+06+29+00 = 0x16B  →  keep the low byte: 6B</text>
<text x="40" y="426" class="s">Boot code 00 = no key held (normal power-on, inference). Keys held at power-on give other codes</text><text x="40" y="446" class="s">(settings reset, region swap, service screens).</text>
<text x="40" y="474" class="b">MAIN answers with one byte, then its own first frame:</text>
<rect x="40" y="484" width="88" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="84" y="516" text-anchor="middle" class="hex">06</text>
<text x="140" y="514">ACK</text>
<rect x="200" y="484" width="88" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="244" y="516" text-anchor="middle" class="hex">60</text>
<rect x="288" y="484" width="440" height="48" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="508" y="514" text-anchor="middle">versions of all four chips + radio status</text>
<rect x="728" y="484" width="88" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="772" y="516" text-anchor="middle" class="hex">ss</text>
<text x="828" y="514" class="s">182 bytes</text>
<text x="40" y="560" class="s">Line: about 345,600 bit/s, 8 data bits, no parity, 2 stop bits, so one byte takes 11 bits ≈ 32 µs.</text>
<text x="40" y="582" class="s">The 153-byte status frame that MAIN sends after every change takes about 5 ms.</text>
</svg>
