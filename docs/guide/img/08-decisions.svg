<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
<title>Decisions waiting for the owner</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#FFFFFF"/>
<rect x="40" y="40" width="880" height="580" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="3" />
<rect x="380" y="22" width="200" height="40" rx="8" fill="#D1D5DB" stroke="#6B7280" stroke-width="2" />
<circle cx="480" cy="42" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<rect x="64" y="76" width="832" height="528" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
<text x="480" y="112" font-size="20" text-anchor="middle" font-weight="bold" fill="#1F2937" >Waiting for the owner's decision</text>
<text x="480" y="136" font-size="14" text-anchor="middle" font-weight="normal" fill="#374151" >Nothing on this list has been done yet. Each item is the owner's call.</text>
<rect x="88" y="168" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
<text x="132" y="188" font-size="17" text-anchor="start" font-weight="bold" fill="#1F2937" >Read-only CAT tests</text>
<text x="132" y="214" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >Send a few undocumented query forms, e.g. VE0;…VE3;, JP0710;,</text>
<text x="132" y="232" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >FD000;, PE000;, SPIR;  (never any of the set forms)</text>
<rect x="760" y="168" width="116" height="30" rx="15" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="818" y="188" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2937" >rung 1</text>
<line x1="88" y1="244" x2="876" y2="244" stroke="#E5E7EB" stroke-width="2"/>
<rect x="88" y="254" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
<text x="132" y="274" font-size="17" text-anchor="start" font-weight="bold" fill="#1F2937" >Debug console: step 0 or step 1?</text>
<text x="132" y="300" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >Step 0: JTAG RAM write on J6003 (gone at power cycle).</text>
<text x="132" y="318" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >Step 1: SD-card update with the one-byte gate patch.</text>
<rect x="760" y="254" width="116" height="30" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
<text x="818" y="274" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2937" >rung 2 / 3</text>
<line x1="88" y1="330" x2="876" y2="330" stroke="#E5E7EB" stroke-width="2"/>
<rect x="88" y="340" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
<text x="132" y="360" font-size="17" text-anchor="start" font-weight="bold" fill="#1F2937" >FPGA “hello” stage 1</text>
<text x="132" y="386" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >Load the no-pin test design into the FPGA over J2001;</text>
<text x="132" y="404" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >power cycle to restore.</text>
<rect x="760" y="340" width="116" height="30" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
<text x="818" y="360" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2937" >rung 2</text>
<line x1="88" y1="416" x2="876" y2="416" stroke="#E5E7EB" stroke-width="2"/>
<rect x="88" y="426" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
<text x="132" y="446" font-size="17" text-anchor="start" font-weight="bold" fill="#1F2937" >Read the FPGA package marking</text>
<text x="132" y="472" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >Look under the SDR module's shield: CSG324 or FGG484?</text>
<text x="132" y="490" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >Needed before any design that drives a pin.</text>
<rect x="760" y="426" width="116" height="30" rx="15" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" />
<text x="818" y="446" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2937" >look only</text>
<line x1="88" y1="502" x2="876" y2="502" stroke="#E5E7EB" stroke-width="2"/>
<rect x="88" y="512" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
<text x="132" y="532" font-size="17" text-anchor="start" font-weight="bold" fill="#1F2937" >US 60 m TX check (possible)</text>
<text x="132" y="558" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >The code suggests the US table never allows 60 m TX</text>
<text x="132" y="576" font-size="14" text-anchor="start" font-weight="normal" fill="#374151" >(inference). Only an on-air test would confirm it.</text>
<rect x="760" y="512" width="116" height="30" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" />
<text x="818" y="532" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2937" >transmits</text>
</svg>
