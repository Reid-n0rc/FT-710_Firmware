<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
  <title>What is in Yaesu's firmware update zip</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#FFFFFF"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold">FT-710_Firmware_updata_202402.zip</text>

  <!-- zip icon -->
  <g transform="translate(40,80)">
    <path d="M0,20 L60,20 L75,0 L150,0 L150,250 L0,250 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
    <rect x="66" y="40" width="18" height="12" fill="#6B7280"/>
    <rect x="66" y="64" width="18" height="12" fill="#6B7280"/>
    <rect x="66" y="88" width="18" height="12" fill="#6B7280"/>
    <rect x="66" y="112" width="18" height="12" fill="#6B7280"/>
    <rect x="60" y="136" width="30" height="34" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <text x="75" y="200" text-anchor="middle" font-size="16" font-weight="bold">ZIP</text>
    <text x="75" y="222" text-anchor="middle" font-size="14">11.2 MB</text>
  </g>
  <line x1="196" y1="205" x2="236" y2="205" stroke="#1F2937" stroke-width="2" marker-end="url(#ah)"/>

  <!-- column headers -->
  <text x="262" y="70" font-size="14" font-weight="bold">file</text>
  <text x="560" y="70" font-size="14" font-weight="bold">tag</text>
  <text x="610" y="70" font-size="14" font-weight="bold">size</text>
  <text x="720" y="70" font-size="14" font-weight="bold">goes to</text>

  <!-- MAIN -->
  <rect x="250" y="80" width="680" height="52" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="262" y="104" font-size="15" font-weight="bold">FT-710_MAIN_V0112.SFL</text>
  <text x="262" y="124" font-size="14">V01-12 · 2024-02-16</text>
  <text x="560" y="112" font-size="15" font-family="DejaVu Sans Mono, monospace">MC</text>
  <text x="610" y="112" font-size="14">1.36 MB</text>
  <text x="720" y="112" font-size="14">MAIN CPU (Renesas RX651)</text>

  <!-- DISPLAY -->
  <rect x="250" y="140" width="680" height="52" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="262" y="164" font-size="15" font-weight="bold">FT-710_DISPLAY_V0108.SFL</text>
  <text x="262" y="184" font-size="14">V01-08 · 2023-06-29</text>
  <text x="560" y="172" font-size="15" font-family="DejaVu Sans Mono, monospace">PC</text>
  <text x="610" y="172" font-size="14">3.33 MB</text>
  <text x="720" y="172" font-size="14">DISPLAY CPU (RZ/A1H)</text>

  <!-- IFDSP -->
  <rect x="250" y="200" width="680" height="52" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
  <text x="262" y="224" font-size="15" font-weight="bold">FT-710_IFDSP_V0101.SFL</text>
  <text x="262" y="244" font-size="14">V01-01 · 2023-03-23</text>
  <text x="560" y="232" font-size="15" font-family="DejaVu Sans Mono, monospace">ID</text>
  <text x="610" y="232" font-size="14">0.42 MB</text>
  <text x="720" y="232" font-size="14">IF DSP (NXP i.MX RT685)</text>

  <!-- SDR -->
  <rect x="250" y="260" width="680" height="52" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="262" y="284" font-size="15" font-weight="bold">FT-710_SDR_V0104.SFL</text>
  <text x="262" y="304" font-size="14">V01-04 · 2023-03-24</text>
  <text x="560" y="292" font-size="15" font-family="DejaVu Sans Mono, monospace">SR</text>
  <text x="610" y="292" font-size="14">4.39 MB</text>
  <text x="720" y="292" font-size="14">SDR FPGA (Artix-7)</text>

  <!-- manual -->
  <rect x="250" y="320" width="680" height="52" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="262" y="344" font-size="15" font-weight="bold">Firmware_Ver_Up_Manual_ENG_FT-710_2211-A.pdf</text>
  <text x="262" y="364" font-size="14">how to update, step by step</text>
  <text x="720" y="352" font-size="14">you</text>

  <text x="480" y="410" text-anchor="middle" font-size="14">Four encoded .SFL files, one per programmable chip, plus the PDF manual. No PC program is included.</text>
</svg>
