<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
  <title>MAIN main loop: sixteen jobs on a clock face, with timer interrupts around it</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
  <rect width="960" height="700" fill="#FFFFFF"/>
  <text x="480" y="34" font-size="20" font-weight="bold" text-anchor="middle">MAIN: one loop, sixteen jobs, a few clocks ticking underneath</text>
  <circle cx="320" cy="350" r="170" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <path d="M 340.7 181.3 A 170 170 0 0 1 362.6 185.4" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 403.7 202.0 A 170 170 0 0 1 422.3 214.2" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 454.0 245.3 A 170 170 0 0 1 466.5 263.7" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 483.8 304.6 A 170 170 0 0 1 488.3 326.3" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 488.7 370.7 A 170 170 0 0 1 484.6 392.6" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 468.0 433.7 A 170 170 0 0 1 455.8 452.3" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 424.7 484.0 A 170 170 0 0 1 406.3 496.5" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 365.4 513.8 A 170 170 0 0 1 343.7 518.3" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 299.3 518.7 A 170 170 0 0 1 277.4 514.6" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 236.3 498.0 A 170 170 0 0 1 217.7 485.8" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 186.0 454.7 A 170 170 0 0 1 173.5 436.3" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 156.2 395.4 A 170 170 0 0 1 151.7 373.7" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 151.3 329.3 A 170 170 0 0 1 155.4 307.4" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 172.0 266.3 A 170 170 0 0 1 184.2 247.7" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 215.3 216.0 A 170 170 0 0 1 233.7 203.5" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <path d="M 274.6 186.2 A 170 170 0 0 1 296.3 181.7" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#ahb)"/>
  <circle cx="320" cy="350" r="130" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="288" font-size="20" text-anchor="middle" font-weight="bold">main_loop</text>
  <text x="320" y="310" font-size="15" text-anchor="middle">never returns</text>
  <text x="320" y="332" font-size="15" text-anchor="middle"></text>
  <text x="320" y="354" font-size="15" text-anchor="middle">each job checks its</text>
  <text x="320" y="376" font-size="15" text-anchor="middle">flags and timers,</text>
  <text x="320" y="398" font-size="15" text-anchor="middle">does a little work,</text>
  <text x="320" y="420" font-size="15" text-anchor="middle">and returns</text>
  <circle cx="320.0" cy="180.0" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="320.0" y="185.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="320.0" y="137.0" font-size="14" text-anchor="middle">watchdog</text>
  <text x="320.0" y="154.0" font-size="14" text-anchor="middle">kick</text>
  <circle cx="385.1" cy="192.9" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="385.1" y="197.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="395.0" y="151.9" font-size="14" text-anchor="start">TX/RX +</text>
  <text x="395.0" y="168.9" font-size="14" text-anchor="start">power</text>
  <circle cx="440.2" cy="229.8" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="440.2" y="234.8" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="458.6" y="216.4" font-size="14" text-anchor="start">SDR link</text>
  <circle cx="477.1" cy="284.9" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="477.1" y="289.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="501.1" y="280.0" font-size="14" text-anchor="start">DSP link</text>
  <circle cx="490.0" cy="350.0" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="490.0" y="355.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="516.0" y="346.5" font-size="14" text-anchor="start">RF relays</text>
  <text x="516.0" y="363.5" font-size="14" text-anchor="start">+ lines</text>
  <circle cx="477.1" cy="415.1" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="477.1" y="420.1" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="501.1" y="421.5" font-size="14" text-anchor="start">beeps +</text>
  <text x="501.1" y="438.5" font-size="14" text-anchor="start">sidetone</text>
  <circle cx="440.2" cy="470.2" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="440.2" y="475.2" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">7</text>
  <text x="458.6" y="485.1" font-size="14" text-anchor="start">CAT</text>
  <text x="458.6" y="502.1" font-size="14" text-anchor="start">command</text>
  <circle cx="385.1" cy="507.1" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="385.1" y="512.1" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">8</text>
  <text x="395.0" y="543.1" font-size="14" text-anchor="start">remote</text>
  <text x="395.0" y="560.1" font-size="14" text-anchor="start">keypad</text>
  <circle cx="320.0" cy="520.0" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="320.0" y="525.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">9</text>
  <text x="320.0" y="558.0" font-size="14" text-anchor="middle">scan</text>
  <circle cx="254.9" cy="507.1" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="254.9" y="512.1" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">10</text>
  <text x="245.0" y="543.1" font-size="14" text-anchor="end">DISPLAY</text>
  <text x="245.0" y="560.1" font-size="14" text-anchor="end">request E8</text>
  <circle cx="199.8" cy="470.2" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="199.8" y="475.2" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">11</text>
  <text x="181.4" y="485.1" font-size="14" text-anchor="end">DISPLAY</text>
  <text x="181.4" y="502.1" font-size="14" text-anchor="end">request E7</text>
  <circle cx="162.9" cy="415.1" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="162.9" y="420.1" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">12</text>
  <text x="138.9" y="430.0" font-size="14" text-anchor="end">CW keyer</text>
  <circle cx="150.0" cy="350.0" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="150.0" y="355.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">13</text>
  <text x="124.0" y="346.5" font-size="14" text-anchor="end">unknown</text>
  <text x="124.0" y="363.5" font-size="14" text-anchor="end">job</text>
  <circle cx="162.9" cy="284.9" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="162.9" y="289.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">14</text>
  <text x="138.9" y="271.5" font-size="14" text-anchor="end">DISPLAY</text>
  <text x="138.9" y="288.5" font-size="14" text-anchor="end">link</text>
  <circle cx="199.8" cy="229.8" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="199.8" y="234.8" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">15</text>
  <text x="181.4" y="207.9" font-size="14" text-anchor="end">key</text>
  <text x="181.4" y="224.9" font-size="14" text-anchor="end">handlers</text>
  <circle cx="254.9" cy="192.9" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="254.9" y="197.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">16</text>
  <text x="245.0" y="168.9" font-size="14" text-anchor="end">tuner</text>
  <text x="650" y="86" font-size="16" font-weight="bold">Interrupts (run in between)</text>
  <rect x="650" y="104" width="290" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="662" y="128" font-size="14" font-weight="bold">TPU0 timer, every 100 µs</text>
  <text x="662" y="149" font-size="14">→ 75 one-shot soft timers</text>
  <rect x="650" y="176" width="290" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="662" y="200" font-size="14" font-weight="bold">TPU3 timer, every 100 ms</text>
  <text x="662" y="221" font-size="14">→ TX time-out timers</text>
  <rect x="650" y="248" width="290" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="662" y="272" font-size="14" font-weight="bold">TPU1 timer, while a beep plays</text>
  <text x="662" y="293" font-size="14">→ next sample to the DAC</text>
  <rect x="650" y="320" width="290" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="662" y="344" font-size="14" font-weight="bold">ADC scan finished</text>
  <text x="662" y="365" font-size="14">→ store the meter readings</text>
  <rect x="650" y="392" width="290" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="662" y="416" font-size="14" font-weight="bold">UART byte in / out</text>
  <text x="662" y="437" font-size="14">→ fill or empty a buffer</text>
  <rect x="650" y="470" width="290" height="80" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="662" y="494" font-size="14" font-weight="bold" fill="#DC2626">Watchdog (IWDT)</text>
  <text x="662" y="515" font-size="14">Job 1 must kick it. No kick for</text>
  <text x="662" y="534" font-size="14">≈2.2 s → NMI (not a plain reset)</text>
  <text x="650" y="584" font-size="14">Jobs never wait for each other: they</text>
  <text x="650" y="604" font-size="14">read the flags and counters that the</text>
  <text x="650" y="624" font-size="14">interrupts set.</text>
  <text x="320" y="606" font-size="14" text-anchor="middle">Numbers = call order in one pass.</text>
  <text x="320" y="626" font-size="14" text-anchor="middle">While the radio is "off", only the watchdog kick, the DISPLAY link</text>
  <text x="320" y="646" font-size="14" text-anchor="middle">and the CAT parser (PS1 only) run, in a smaller loop.</text>
</svg>
