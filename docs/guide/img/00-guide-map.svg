<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Map of the guide: the four chips of the FT-710 and the chapters that cover them</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="440" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1F2937">The FT-710 in one picture, and where each chapter goes</text>

  <!-- radio outline -->
  <rect x="40" y="60" width="880" height="400" rx="18" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/>
  <text x="60" y="88" font-size="15" fill="#6B7280">FT-710 (inside the case)</text>

  <!-- antenna -->
  <line x1="905" y1="60" x2="905" y2="22" stroke="#1F2937" stroke-width="3"/>
  <path d="M891,34 L905,20 L919,34" fill="none" stroke="#1F2937" stroke-width="3"/>
  <text x="893" y="54" font-size="14" fill="#1F2937" text-anchor="end">antenna</text>

  <!-- DISPLAY -->
  <rect x="70" y="110" width="250" height="140" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="195" y="140" font-size="18" font-weight="bold" text-anchor="middle" fill="#166534">DISPLAY</text>
  <text x="195" y="164" font-size="14" text-anchor="middle" fill="#1F2937">Renesas RZ/A1H (ARM)</text>
  <text x="195" y="188" font-size="14" text-anchor="middle" fill="#1F2937">touch screen, keys, knobs,</text>
  <text x="195" y="208" font-size="14" text-anchor="middle" fill="#1F2937">SD card, updates everyone</text>

  <!-- MAIN -->
  <rect x="370" y="110" width="230" height="140" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="485" y="140" font-size="18" font-weight="bold" text-anchor="middle" fill="#1E40AF">MAIN</text>
  <text x="485" y="164" font-size="14" text-anchor="middle" fill="#1F2937">Renesas RX651</text>
  <text x="485" y="188" font-size="14" text-anchor="middle" fill="#1F2937">the boss: radio state,</text>
  <text x="485" y="208" font-size="14" text-anchor="middle" fill="#1F2937">CAT, settings, TX/RX</text>

  <!-- SDR -->
  <rect x="650" y="110" width="240" height="140" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="770" y="140" font-size="18" font-weight="bold" text-anchor="middle" fill="#9A3412">SDR</text>
  <text x="770" y="164" font-size="14" text-anchor="middle" fill="#1F2937">Xilinx Artix-7 FPGA</text>
  <text x="770" y="188" font-size="14" text-anchor="middle" fill="#1F2937">digitises the RF, mixes,</text>
  <text x="770" y="208" font-size="14" text-anchor="middle" fill="#1F2937">filters, makes the scope</text>

  <!-- IFDSP -->
  <rect x="370" y="300" width="230" height="130" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
  <text x="485" y="330" font-size="18" font-weight="bold" text-anchor="middle" fill="#6B21A8">IF DSP</text>
  <text x="485" y="354" font-size="14" text-anchor="middle" fill="#1F2937">NXP i.MX RT685</text>
  <text x="485" y="378" font-size="14" text-anchor="middle" fill="#1F2937">filters, noise reduction,</text>
  <text x="485" y="398" font-size="14" text-anchor="middle" fill="#1F2937">AGC, audio codec</text>

  <!-- links -->
  <line x1="320" y1="180" x2="366" y2="180" stroke="#6B7280" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="600" y1="180" x2="646" y2="180" stroke="#6B7280" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="485" y1="250" x2="485" y2="296" stroke="#6B7280" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <path d="M770,250 L770,365 L604,365" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="780" y="300" font-size="14" fill="#6B7280">I/Q samples</text>
  <path d="M770,90 L770,106" stroke="#1F2937" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M905,60 L905,90 L770,90" fill="none" stroke="#1F2937" stroke-width="2.5"/>

  <!-- speaker and USB -->
  <path d="M640,395 l14,0 l16,-14 l0,44 l-16,-14 l-14,0 z" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <line x1="600" y1="395" x2="636" y2="395" stroke="#6B7280" stroke-width="2"/>
  <text x="680" y="400" font-size="14" fill="#1F2937">speaker</text>
  <rect x="90" y="320" width="200" height="90" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="190" y="350" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">USB to your PC</text>
  <text x="190" y="374" font-size="14" text-anchor="middle" fill="#1F2937">CAT ports, audio,</text>
  <text x="190" y="394" font-size="14" text-anchor="middle" fill="#1F2937">scope stream</text>
  <path d="M250,320 L250,275 L420,275 L420,254" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="262" y="268" font-size="14" fill="#6B7280">CAT commands</text>

  <!-- chapter badges -->
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <circle cx="70" cy="110" r="15" fill="#1F2937"/><text x="70" y="115">6</text>
    <circle cx="600" cy="110" r="15" fill="#1F2937"/><text x="600" y="115">6</text>
    <circle cx="890" cy="250" r="15" fill="#1F2937"/><text x="890" y="255">7</text>
    <circle cx="600" cy="430" r="15" fill="#1F2937"/><text x="600" y="435">7</text>
    <circle cx="343" cy="180" r="15" fill="#1F2937"/><text x="343" y="185">2</text>
    <circle cx="90" cy="320" r="15" fill="#1F2937"/><text x="90" y="325">5</text>
  </g>

  <!-- chapter strip -->
  <g font-size="14" fill="#1F2937">
    <rect x="40" y="478" width="880" height="108" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="60" y="502" font-weight="bold">Chapters</text>
    <text x="60" y="526">1  The radio at a glance</text>
    <text x="60" y="550">2  How the chips talk</text>
    <text x="60" y="574">3  A day in the life</text>
    <text x="340" y="526">4  Firmware files and updates</text>
    <text x="340" y="550">5  CAT remote control</text>
    <text x="340" y="574">6  Inside MAIN and DISPLAY</text>
    <text x="640" y="526">7  Inside the IF DSP and SDR</text>
    <text x="640" y="550">8  Hacking and custom firmware</text>
    <text x="640" y="574">   Glossary</text>
  </g>
</svg>
