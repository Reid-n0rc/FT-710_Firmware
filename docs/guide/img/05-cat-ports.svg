<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1F2937">
  <title>The three CAT ports: two USB COM ports through the CP2105 and the TUNER/LINEAR jack, all ending in MAIN</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="480" y="34" font-size="20" font-weight="bold" text-anchor="middle">Three ways in: the CAT ports</text>

  <!-- PC -->
  <rect x="24" y="90" width="170" height="120" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <rect x="44" y="104" width="130" height="70" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="109" y="134" font-size="14" text-anchor="middle">logger / WSJT-X</text>
  <text x="109" y="156" font-size="14" text-anchor="middle">FA;  MD;  ...</text>
  <text x="109" y="198" font-size="16" font-weight="bold" text-anchor="middle">PC</text>
  <text x="109" y="232" font-size="14" text-anchor="middle">sees two COM ports</text>

  <!-- USB cable -->
  <line x1="194" y1="150" x2="262" y2="150" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="228" y="140" font-size="14" text-anchor="middle">USB</text>

  <!-- radio outline -->
  <rect x="264" y="60" width="672" height="380" rx="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="920" y="84" font-size="15" text-anchor="end" fill="#6B7280">inside the FT-710</text>

  <!-- USB-B socket + hub -->
  <rect x="280" y="110" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="350" y="140" font-size="15" font-weight="bold" text-anchor="middle">USB hub</text>
  <text x="350" y="162" font-size="14" text-anchor="middle">rear USB-B</text>
  <text x="350" y="180" font-size="14" text-anchor="middle">socket</text>
  <!-- hub other ports -->
  <line x1="350" y1="190" x2="350" y2="230" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/>
  <rect x="280" y="232" width="140" height="64" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="350" y="258" font-size="14" text-anchor="middle">USB sound card,</text>
  <text x="350" y="278" font-size="14" text-anchor="middle">scope link (not CAT)</text>

  <!-- CP2105 -->
  <line x1="420" y1="150" x2="468" y2="150" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="100" width="150" height="110" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="545" y="130" font-size="16" font-weight="bold" text-anchor="middle">CP2105</text>
  <text x="545" y="152" font-size="14" text-anchor="middle">dual USB-UART</text>
  <text x="545" y="178" font-size="14" text-anchor="middle">"Enhanced" port</text>
  <text x="545" y="198" font-size="14" text-anchor="middle">"Standard" port</text>

  <!-- arrows to MAIN -->
  <line x1="620" y1="174" x2="726" y2="174" stroke="#1F2937" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="673" y="166" font-size="14" text-anchor="middle">UART</text>
  <line x1="620" y1="196" x2="726" y2="226" stroke="#1F2937" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- MAIN -->
  <rect x="728" y="110" width="190" height="300" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="823" y="138" font-size="18" font-weight="bold" text-anchor="middle" fill="#2563EB">MAIN CPU</text>
  <text x="823" y="158" font-size="14" text-anchor="middle">RX651</text>
  <rect x="744" y="164" width="158" height="44" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="823" y="183" font-size="14" font-weight="bold" text-anchor="middle">port 1 · SCI3</text>
  <text x="823" y="201" font-size="14" text-anchor="middle">starts at 38400</text>
  <rect x="744" y="214" width="158" height="44" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="823" y="233" font-size="14" font-weight="bold" text-anchor="middle">port 2 · SCI0</text>
  <text x="823" y="251" font-size="14" text-anchor="middle">starts at 4800</text>
  <rect x="744" y="330" width="158" height="44" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="823" y="349" font-size="14" font-weight="bold" text-anchor="middle">port 3 · SCI2</text>
  <text x="823" y="367" font-size="14" text-anchor="middle">CAT-3 or tuner</text>
  <text x="823" y="296" font-size="14" text-anchor="middle">one parser</text>
  <text x="823" y="314" font-size="14" text-anchor="middle">for all three</text>

  <!-- RTS/DTR -->
  <text x="545" y="236" font-size="14" text-anchor="middle" fill="#6B7280">RTS / DTR of the Standard</text>
  <text x="545" y="254" font-size="14" text-anchor="middle" fill="#6B7280">port can key PTT / CW</text>

  <!-- TUNER/LINEAR jack -->
  <rect x="470" y="320" width="150" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <circle cx="500" cy="360" r="16" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <circle cx="500" cy="360" r="5" fill="#6B7280"/>
  <text x="575" y="346" font-size="14" font-weight="bold" text-anchor="middle">TUNER/</text>
  <text x="575" y="364" font-size="14" font-weight="bold" text-anchor="middle">LINEAR</text>
  <text x="575" y="382" font-size="14" text-anchor="middle">jack, 5 V</text>
  <line x1="620" y1="352" x2="726" y2="352" stroke="#1F2937" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="673" y="344" font-size="14" text-anchor="middle">TTL</text>
  <rect x="24" y="320" width="170" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="109" y="346" font-size="14" text-anchor="middle">tuner, amplifier or</text>
  <text x="109" y="366" font-size="14" text-anchor="middle">another 5 V TTL</text>
  <text x="109" y="386" font-size="14" text-anchor="middle">serial device</text>
  <line x1="194" y1="360" x2="468" y2="360" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- footer notes -->
  <text x="40" y="490" font-size="15">• The answer always goes back out of the port the command came in on.</text>
  <text x="40" y="516" font-size="15">• Auto-information (AI) messages go to every port that has AI switched on. Baud rates are set in the menu.</text>
</svg>
