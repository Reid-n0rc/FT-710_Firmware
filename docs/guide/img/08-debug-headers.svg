<text x="480" y="764" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >All four are flat-cable (FFC) sockets of the FLT-SM2 family: you need a matching FFC breakout</text>
<text x="480" y="782" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937" >board and a short flat cable. Measure the pitch before you order (inference).</text>
