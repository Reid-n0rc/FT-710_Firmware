<text x="80" y="256" font-size="14" text-anchor="start" font-weight="normal" fill="#6B7280">(plus 5167.5 kHz, off this scale)</text>
<text x="666.0" y="226" font-size="14" text-anchor="middle" font-weight="normal" fill="#DC2626">every point refused</text>
<rect x="40" y="400" width="430" height="140" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="50" y="424" font-size="14" text-anchor="start" font-weight="bold" fill="#1F2937">The test, for every row:</text>
<text x="50" y="442" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937">allowed if  lo ≤ f  and  f &lt; hi</text>
<text x="50" y="460" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937"></text>
<text x="50" y="478" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937">Europe, f = 5360:  5351.5 ≤ 5360 ✓   5360 &lt; 5366.5 ✓</text>
<rect x="490" y="400" width="430" height="140" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="500" y="424" font-size="14" text-anchor="start" font-weight="bold" fill="#1F2937">US row 5332 kHz, f = 5332:</text>
<text x="500" y="442" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937">lo ≤ f:  5332 ≤ 5332  ✓</text>
<text x="500" y="460" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937">f &lt; hi:  5332 &lt; 5332  ✗  → refused</text>
<text x="500" y="478" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937"></text>
<text x="500" y="496" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937">so 60 m TX in the US table appears never</text>
<text x="500" y="514" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2937">to be allowed (inference, not tested on air)</text>
</svg>
