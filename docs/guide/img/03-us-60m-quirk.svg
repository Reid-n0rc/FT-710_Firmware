<text x="900.0" y="356" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2937">5410</text>
<text x="920" y="378" font-size="14" text-anchor="end" font-weight="normal" fill="#1F2937">kHz</text>
<text x="80" y="88" font-size="14" text-anchor="start" font-weight="bold" fill="#16A34A">Europe table: one row 5351.5 ≤ f &lt; 5366.5</text>
<rect x="373.5" y="100" width="135.0" height="20" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" />
<circle cx="373.5" cy="110" r="7" fill="#16A34A"/>
